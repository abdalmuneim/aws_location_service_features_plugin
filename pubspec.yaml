name: aws_location_service_features
description: >-
  Amazon Location Service for Flutter: Maps, Places and Routes (v2) with an
  API key, a MapLibre map widget, on-device geofencing, and device tracking to
  Amazon Location trackers through the Amazon Location Mobile SDKs (Android,
  iOS) and a Dart implementation on the web.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  crypto: ^3.0.6
  equatable: ^3.0.0
  geolocator: ^14.1.1
  http: ^1.6.0
  maplibre_gl: ^0.27.1
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.devmnem.aws_location_service_features
        pluginClass: AwsLocationServiceFeaturesPlugin
      ios:
        pluginClass: AwsLocationServiceFeaturesPlugin
      web:
        pluginClass: AwsLocationWeb
        fileName: aws_location_service_features_web.dart
